<!doctype html>
<html lang="tr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#eef3fa" />
    <meta name="description" content="Kodaryum AgentSpace — bir kurucu, bir yapay zekâ şirketi, tek merkezden yönetim" />
    <title>Kodaryum AgentSpace</title>
    <script>
      // Kayıtlı temayı ilk boyamadan önce uygula (varsayılan: açık tema) → renk sıçraması olmaz
      try {
        if (localStorage.getItem('kkm:theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#05080f'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
