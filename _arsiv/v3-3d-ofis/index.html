<!doctype html>
<html lang="tr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9eef5" />
    <meta name="description" content="KKM — Kodaryum Kontrol Merkezi: yapay zekâ kurullarıyla 3D şirket yönetimi" />
    <title>KKM — Kodaryum Kontrol Merkezi</title>
    <script>
      // Kayıtlı temayı ilk boyamadan önce uygula (varsayılan: açık tema) → renk sıçraması olmaz
      try {
        if (localStorage.getItem('kkm:theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#05080f'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
